services:
  sams-db:
    build:
      context: src/main/docker/postgres
    image: sams-db:1.0
    container_name: sams-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sams
    ports:
      - 5435:5432
    volumes:
      - sams-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sams-db-data:
